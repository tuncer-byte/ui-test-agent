<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>WebMCP Agent UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { height: 100%; margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
  webview { display: inline-flex; width: 100%; height: 100%; border: none; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 999px; }
  .nav-icon-btn {
    width: 1.75rem; height: 1.75rem; display: flex; align-items: center; justify-content: center;
    border-radius: 9999px; color: #475569; font-size: 1rem; line-height: 1;
  }
  .nav-icon-btn:hover:not(:disabled) { background: #f1f5f9; }
  .nav-icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .progress-indeterminate {
    background: linear-gradient(90deg, transparent 0%, #1e87f0 50%, transparent 100%);
    background-size: 50% 100%;
    animation: indeterminate 1.1s infinite linear;
  }
  @keyframes indeterminate { from { background-position: -50% 0; } to { background-position: 150% 0; } }
</style>
</head>
<body class="bg-white text-slate-800">

<div class="h-14 flex items-center px-5 border-b" style="background:#0f1d3d; border-color: rgba(255,255,255,0.08);">
  <div class="text-white text-sm font-semibold">WebMCP Agent UI</div>
  <div class="text-[10px] font-semibold uppercase tracking-wider ml-3 px-2 py-1 rounded-full" style="background: rgba(30,135,240,0.15); color:#93c5fd;">AI Native SDLC Challenge</div>
</div>

<div class="flex" style="height: calc(100% - 3.5rem);">

  <!-- LEFT PANEL — CONTROLS -->
  <aside class="w-[440px] shrink-0 border-r border-slate-200 overflow-y-auto p-5 space-y-6">

    <!-- API KEY -->
    <section>
      <label class="text-xs font-medium text-slate-500">Gemini API Key</label>
      <input id="api-key" type="password" placeholder="AIza..." class="mt-1 w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-blue-400" />
      <label class="text-xs font-medium text-slate-500 mt-3 block">Model</label>
      <input id="model" type="text" value="gemini-2.5-flash" class="mt-1 w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-blue-400" />
    </section>

    <div class="border-t border-slate-100"></div>

    <!-- TARGET URL -->
    <section>
      <label class="text-xs font-medium text-slate-500">Target URL (page exposing WebMCP tools)</label>
      <div class="flex gap-2 mt-1">
        <input id="target-url" type="text" placeholder="http://localhost:8765/index.html" class="flex-1 px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-blue-400" />
        <button id="load-btn" class="px-4 py-2 rounded-xl text-sm font-medium text-white" style="background:#1e87f0;">Load</button>
      </div>
      <div id="mcp-status" class="text-xs text-slate-400 mt-2 flex items-center gap-1.5">
        <span id="mcp-status-dot" class="inline-block w-2 h-2 rounded-full" style="background:#94a3b8;"></span>
        <span id="mcp-status-text">Page not loaded yet</span>
      </div>
    </section>

    <div class="border-t border-slate-100"></div>

    <!-- TOOL DISCOVERY -->
    <section>
      <div class="flex items-center justify-between gap-2">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-500">Tools</h2>
        <div class="flex gap-1.5">
          <button id="discover-btn" disabled class="px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 text-xs font-medium opacity-40 cursor-not-allowed">Discover</button>
          <button id="infer-btn" disabled class="px-3 py-1.5 rounded-lg border border-amber-200 text-amber-700 text-xs font-medium opacity-40 cursor-not-allowed" title="If the site has no native WebMCP, automatically infers (lower-confidence) tools from its forms">🔍 Infer from DOM</button>
        </div>
      </div>
      <div id="tools-list" class="mt-2 space-y-1.5 text-sm text-slate-400">Not discovered yet.</div>
    </section>

    <div class="border-t border-slate-100"></div>

    <!-- SCENARIO GENERATION -->
    <section>
      <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Test Scenarios</h2>
      <div class="flex gap-2">
        <button id="gemini-gen-btn" disabled class="flex-1 px-3 py-2 rounded-xl text-sm font-medium text-white opacity-40 cursor-not-allowed" style="background:#1e87f0;">✨ Generate with Gemini</button>
        <button id="rules-gen-btn" disabled class="px-3 py-2 rounded-xl border border-slate-200 text-slate-600 text-sm font-medium opacity-40 cursor-not-allowed">Rule-Based</button>
      </div>
      <div id="scenarios-list" class="mt-3 space-y-1.5"></div>
    </section>

    <button id="run-btn" disabled class="w-full px-5 py-2.5 rounded-xl text-sm font-semibold text-white opacity-40 cursor-not-allowed" style="background:#0f1d3d;">
      ▶ Run Tests via WebMCP
    </button>

    <div class="border-t border-slate-100"></div>

    <!-- RESULTS -->
    <section>
      <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Results</h2>
      <div id="results-list" class="space-y-1.5 text-sm text-slate-400">No tests run yet.</div>
      <div id="results-summary" class="mt-3 text-sm font-semibold hidden"></div>
    </section>

  </aside>

  <!-- RIGHT PANEL — LIVE BROWSER VIEW -->
  <main class="flex-1 flex flex-col" style="background:#dee1e6;">

    <!-- Fake tab strip -->
    <div class="h-9 flex items-end px-2 pt-1.5 gap-1">
      <div class="flex items-center gap-2 px-3 py-1.5 rounded-t-lg bg-white text-xs text-slate-700 max-w-[240px] shadow-sm">
        <span id="tab-favicon">🌐</span>
        <span id="tab-title" class="truncate">New Tab</span>
      </div>
    </div>

    <!-- Address bar / navigation -->
    <div class="h-11 flex items-center gap-1.5 px-3 bg-white border-b border-slate-200">
      <button id="back-btn" class="nav-icon-btn" disabled>‹</button>
      <button id="forward-btn" class="nav-icon-btn" disabled>›</button>
      <button id="reload-btn" class="nav-icon-btn">⟳</button>
      <div class="flex-1 flex items-center gap-2 bg-slate-100 rounded-full px-3.5 py-1.5 ml-1">
        <span id="lock-icon" class="text-xs">🔒</span>
        <input id="address-input" type="text" value="about:blank" class="flex-1 bg-transparent text-xs text-slate-700 outline-none font-mono" />
      </div>
    </div>

    <!-- Page area -->
    <div class="flex-1 relative bg-white">
      <div id="loading-bar" class="hidden absolute top-0 left-0 h-0.5 progress-indeterminate" style="width:100%; z-index:10;"></div>
      <webview id="target-view" src="about:blank" allowpopups></webview>
    </div>
  </main>

</div>

<script src="renderer.js"></script>
</body>
</html>
